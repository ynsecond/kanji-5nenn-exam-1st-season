<html lang="ja">

<title>漢字テスト 5年生 1学期</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}
.screen { display: none; min-height: 100vh; padding: 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* Home Screen */
#home { justify-content: center; gap: 20px; }
#home h1 { font-size: 28px; text-align: center; margin-bottom: 10px; }
#home .subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
.test-btn {
  width: 100%; max-width: 350px; padding: 18px 24px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none; border-radius: 16px; color: #fff;
  font-size: 18px; font-weight: bold; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  transition: transform 0.15s;
}
.test-btn:active { transform: scale(0.97); }
.test-btn .progress { font-size: 13px; opacity: 0.8; }
.mode-toggle {
  display: flex; gap: 8px; margin-bottom: 10px; width: 100%; max-width: 350px;
}
.mode-btn {
  flex: 1; padding: 12px; border: 2px solid #667eea; border-radius: 12px;
  background: transparent; color: #667eea; font-size: 14px; font-weight: bold;
  cursor: pointer;
}
.mode-btn.active { background: #667eea; color: #fff; }
.reset-btn {
  margin-top: 20px; padding: 12px 24px; background: #333;
  border: 1px solid #555; border-radius: 12px; color: #aaa;
  font-size: 14px; cursor: pointer;
}

/* Quiz Screen */
#quiz { padding-top: 10px; }
.quiz-header {
  width: 100%; max-width: 500px; display: flex;
  justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.back-btn {
  background: none; border: none; color: #667eea;
  font-size: 16px; cursor: pointer; padding: 8px;
}
.quiz-progress { font-size: 14px; color: #aaa; }
.quiz-score { font-size: 14px; color: #4ecdc4; }
.progress-bar {
  width: 100%; max-width: 500px; height: 6px;
  background: #333; border-radius: 3px; margin-bottom: 16px;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #667eea, #4ecdc4);
  border-radius: 3px; transition: width 0.3s;
}
.question-card {
  width: 100%; max-width: 500px; background: #16213e;
  border-radius: 20px; padding: 24px; margin-bottom: 16px;
}
.question-num { font-size: 13px; color: #667eea; margin-bottom: 8px; }
.question-sentence { font-size: 20px; line-height: 1.6; margin-bottom: 8px; }
.question-reading {
  display: inline-block; background: #667eea33;
  padding: 4px 12px; border-radius: 8px; font-size: 16px; color: #667eea;
}

/* Canvas */
.canvas-container {
  width: 100%; max-width: 500px; margin-bottom: 12px; position: relative;
}
#drawCanvas {
  width: 100%; aspect-ratio: 2/1; background: #fff;
  border-radius: 16px; touch-action: none; cursor: crosshair;
}
.canvas-guide {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #ccc; font-size: 14px; pointer-events: none;
  transition: opacity 0.3s;
}
.btn-row {
  display: flex; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 12px;
}
.action-btn {
  flex: 1; padding: 14px; border: none; border-radius: 12px;
  font-size: 16px; font-weight: bold; cursor: pointer;
  transition: transform 0.15s;
}
.action-btn:active { transform: scale(0.95); }
.clear-btn { background: #333; color: #aaa; }
.submit-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.skip-btn { background: #333; color: #f39c12; }

.feedback {
  width: 100%; max-width: 500px; padding: 16px;
  border-radius: 16px; margin-bottom: 12px;
  text-align: center; font-size: 18px; font-weight: bold;
  display: none;
}
.feedback.correct { display: block; background: #1b4332; color: #4ecdc4; }
.feedback.incorrect { display: block; background: #3d0000; color: #ff6b6b; }
.feedback .answer-display { font-size: 48px; margin: 8px 0; }
.next-btn {
  width: 100%; max-width: 500px; padding: 16px;
  background: linear-gradient(135deg, #4ecdc4, #44bd9e);
  border: none; border-radius: 12px; color: #fff;
  font-size: 18px; font-weight: bold; cursor: pointer;
  display: none;

/* Results Screen */

.results-score {
  font-size: 72px; font-weight: bold;
  background: linear-gradient(135deg, #667eea, #4ecdc4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.results-label { font-size: 18px; color: #aaa; }
.results-detail { font-size: 16px; color: #ccc; margin: 8px 0; }
.wrong-list {
  width: 100%; max-width: 400px; text-align: left;
  background: #16213e; border-radius: 16px; padding: 16px;
  max-height: 300px; overflow-y: auto;

.wrong-list h3 { color: #ff6b6b; margin-bottom: 12px; font-size: 16px; }
.wrong-item {
  padding: 8px 0; border-bottom: 1px solid #ffffff15;
  display: flex; justify-content: space-between; align-items: center;

.wrong-q { font-size: 14px; flex: 1; }
.wrong-a { font-size: 20px; color: #4ecdc4; margin-left: 8px; font-weight: bold; }

.typing-input {
  width: 100%; max-width: 500px; margin-bottom: 12px;

.typing-input input {
  width: 100%; padding: 16px; font-size: 24px; text-align: center;
  background: #fff; border: 3px solid #667eea; border-radius: 16px;
  color: #333; outline: none;
}
.typing-input input:focus { border-color: #4ecdc4; }
</style>
</head>
<body>

<!-- Home Screen -->
<div id="home" class="screen active">
  <h1>漢字テスト<br>5年生 1学期</h1>
  <p class="subtitle">手書きで漢字を練習しよう！</p>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('draw')">手書きモード</button>
    <button class="mode-btn" onclick="setMode('type')">入力モード</button>
  </div>
  <div id="testButtons"></div>
  <button class="reset-btn" onclick="resetAll()">記録をリセット</button>
</div>

<!-- Quiz Screen -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="goHome()">← 戻る</button>
    <span class="quiz-progress" id="qProgress"></span>
    <span class="quiz-score" id="qScore"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="question-card">
    <div class="question-num" id="qNum"></div>
    <div class="question-sentence" id="qSentence"></div>
    <div class="question-reading" id="qReading"></div>
  </div>

  <!-- Drawing mode -->
  <div id="drawMode">
    <div class="canvas-container">
      <canvas id="drawCanvas"></canvas>
      <div class="canvas-guide" id="canvasGuide">ここに漢字を書いてください</div>
    </div>
    <div class="btn-row">
      <button class="action-btn clear-btn" onclick="clearCanvas()">消す</button>
      <button class="action-btn submit-btn" onclick="submitAnswer()">答え合わせ</button>
    </div>
  </div>

  <!-- Typing mode -->
  <div id="typeMode" style="display:none;">
    <div class="typing-input">
      <input type="text" id="typeInput" placeholder="漢字を入力" autocomplete="off">
    </div>
    <div class="btn-row">
      <button class="action-btn clear-btn" onclick="document.getElementById('typeInput').value=''">消す</button>
      <button class="action-btn submit-btn" onclick="submitTyped()">答え合わせ</button>
    </div>
  </div>

  <div class="btn-row">
    <button class="action-btn skip-btn" onclick="skipQuestion()">スキップ</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>
</div>

<!-- Results Screen -->
<div id="results" class="screen">
  <div class="results-label">テスト結果</div>
  <div class="results-score" id="rScore"></div>
  <div class="results-detail" id="rDetail"></div>
  <div class="wrong-list" id="wrongList" style="display:none;">
    <h3>間違えた問題</h3>
    <div id="wrongItems"></div>
  </div>
  <button class="test-btn" onclick="retryWrong()" id="retryBtn" style="display:none;max-width:350px;margin-top:8px;">
    間違えた問題をもう一度
  </button>
  <button class="test-btn" onclick="goHome()" style="max-width:350px;margin-top:8px;">
    ホームに戻る
  </button>
</div>

// ===== APP STATE =====
let currentTest = 0;
let currentQ = 0;
let score = 0;
let wrongAnswers = [];
let isDrawing = false;
let lastX = 0, lastY = 0;
let ctx = null;
let hasDrawn = false;
let mode = 'draw'; // 'draw' or 'type'
let retryMode = false;
let retryQuestions = [];

function loadProgress() {
  try { return JSON.parse(localStorage.getItem('kanjiProgress') || '{}'); } catch { return {}; }
}
function saveProgress(testIdx, s, total) {
  const p = loadProgress();
  p[testIdx] = { score: s, total, date: new Date().toISOString().slice(0, 10) };
  localStorage.setItem('kanjiProgress', JSON.stringify(p));
}

// ===== HOME SCREEN =====
function renderHome() {
  const container = document.getElementById('testButtons');
  container.innerHTML = '';
  const progress = loadProgress();
  testData.forEach((test, i) => {
    const btn = document.createElement('button');
    btn.className = 'test-btn';
    const p = progress[i];
    btn.innerHTML = `
      <span>${test.name}（${test.questions.length}問）</span>
      <span class="progress">${p ? p.score + '/' + p.total + ' ✓' : '未挑戦'}</span>
    `;
    btn.onclick = () => startTest(i);
    container.appendChild(btn);
  });
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && m === 'draw') || (i === 1 && m === 'type'));
  });
}

function resetAll() {
  if (confirm('すべての記録をリセットしますか？')) {
    localStorage.removeItem('kanjiProgress');
    renderHome();
  }
}

// ===== QUIZ =====
function startTest(testIdx) {
  currentTest = testIdx;
  currentQ = 0;
  score = 0;
  wrongAnswers = [];
  retryMode = false;
  showScreen('quiz');
  showQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function getQuestions() {
  return retryMode ? retryQuestions : testData[currentTest].questions;
}

function showQuestion() {
  const questions = getQuestions();
  if (currentQ >= questions.length) { showResults(); return; }
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = `問 ${currentQ + 1} / ${questions.length}`;
  document.getElementById('qProgress').textContent = `${currentQ + 1}/${questions.length}`;
  document.getElementById('qScore').textContent = `正解: ${score}`;
  document.getElementById('progressFill').style.width = `${(currentQ / questions.length) * 100}%`;

  // Highlight the reading in the sentence
  const highlighted = q.sentence.replace(`（${q.reading}）`, `<span style="color:#ff6b6b;font-weight:bold">（${q.reading}）</span>`);
  document.getElementById('qSentence').innerHTML = highlighted;
  document.getElementById('qReading').textContent = `書く漢字: ${q.reading}`;

  // Reset UI
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';

  if (mode === 'draw') {
    document.getElementById('drawMode').style.display = 'block';
    document.getElementById('typeMode').style.display = 'none';
    clearCanvas();
  } else {
    document.getElementById('drawMode').style.display = 'none';
    document.getElementById('typeMode').style.display = 'block';
    const input = document.getElementById('typeInput');
    input.value = '';
    input.focus();
  }
}

function goHome() {
  showScreen('home');
  renderHome();
}

// ===== CANVAS DRAWING =====
function initCanvas() {
  const canvas = document.getElementById('drawCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.width;
  canvas.style.height = (rect.width / 2) + 'px';
  ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#333';

  // Draw grid
  drawGrid();

  // Touch events
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd);
  // Mouse events
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('mouseleave', onMouseUp);
}

function drawGrid() {
  if (!ctx) return;
  const c = document.getElementById('drawCanvas');
  ctx.save();
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  // Vertical center
  ctx.beginPath();
  ctx.moveTo(c.width / 2, 0);
  ctx.lineTo(c.width / 2, c.height);
  ctx.stroke();
  // Horizontal center
  ctx.beginPath();
  ctx.moveTo(0, c.height / 2);
  ctx.lineTo(c.width, c.height / 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 6;
}

function getPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function onTouchStart(e) { e.preventDefault(); const p = getPos(e, e.target); startDraw(p.x, p.y); }
function onTouchMove(e) { e.preventDefault(); const p = getPos(e, e.target); draw(p.x, p.y); }
function onTouchEnd() { isDrawing = false; }
function onMouseDown(e) { const p = getPos(e, e.target); startDraw(p.x, p.y); }
function onMouseMove(e) { if (isDrawing) { const p = getPos(e, e.target); draw(p.x, p.y); } }
function onMouseUp() { isDrawing = false; }

function startDraw(x, y) {
  isDrawing = true;
  lastX = x; lastY = y;
  hasDrawn = true;
  document.getElementById('canvasGuide').style.opacity = '0';
}

function draw(x, y) {
  if (!isDrawing) return;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  lastX = x; lastY = y;
}

function clearCanvas() {
  if (!ctx) return;
  const c = document.getElementById('drawCanvas');
  ctx.clearRect(0, 0, c.width, c.height);
  drawGrid();
  hasDrawn = false;
  document.getElementById('canvasGuide').style.opacity = '1';
}

// ===== ANSWER CHECKING =====
function submitAnswer() {
  if (!hasDrawn) { alert('漢字を書いてください！'); return; }
  // In drawing mode, show the correct answer for self-check
  showAnswer();
}

function submitTyped() {
  const input = document.getElementById('typeInput').value.trim();
  if (!input) { alert('漢字を入力してください！'); return; }
  const q = getQuestions()[currentQ];
  const isCorrect = input === q.answer || input === q.answer.replace(/する$|をする$/, '');
  showFeedback(isCorrect);
}

function showAnswer() {
  const q = getQuestions()[currentQ];
  const fb = document.getElementById('feedback');
  fb.className = 'feedback correct';
  fb.innerHTML = `
    <div>正解はこちら：</div>
    <div class="answer-display">${q.answer}</div>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;">
      <button onclick="selfJudge(true)" style="padding:12px 24px;background:#1b4332;color:#4ecdc4;border:2px solid #4ecdc4;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;">⭕ 正解</button>
      <button onclick="selfJudge(false)" style="padding:12px 24px;background:#3d0000;color:#ff6b6b;border:2px solid #ff6b6b;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;">❌ 不正解</button>
    </div>
  `;
}

function selfJudge(correct) {
  showFeedback(correct);
}

function showFeedback(isCorrect) {
  const q = getQuestions()[currentQ];
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    fb.className = 'feedback correct';
    fb.innerHTML = `⭕ 正解！<div class="answer-display">${q.answer}</div>`;
  } else {
    wrongAnswers.push(q);
    fb.className = 'feedback incorrect';
    fb.innerHTML = `❌ 不正解<div class="answer-display">${q.answer}</div><div style="font-size:14px;margin-top:4px;">正解: ${q.answer}</div>`;
  }
  document.getElementById('qScore').textContent = `正解: ${score}`;
  document.getElementById('nextBtn').style.display = 'block';
}

function skipQuestion() {
  const q = getQuestions()[currentQ];
  wrongAnswers.push(q);
  currentQ++;
  showQuestion();
}

function nextQuestion() {
  currentQ++;
  showQuestion();
}

// ===== RESULTS =====
function showResults() {
  const questions = getQuestions();
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('rScore').textContent = `${pct}%`;
  document.getElementById('rDetail').textContent = `${score} / ${total} 問正解`;

  if (!retryMode) {
    saveProgress(currentTest, score, total);
  }

  const wrongList = document.getElementById('wrongList');
  const wrongItems = document.getElementById('wrongItems');
  const retryBtn = document.getElementById('retryBtn');
  wrongItems.innerHTML = '';

  if (wrongAnswers.length > 0) {
    wrongList.style.display = 'block';
    retryBtn.style.display = 'flex';
    wrongAnswers.forEach(q => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<span class="wrong-q">${q.reading}</span><span class="wrong-a">${q.answer}</span>`;
      wrongItems.appendChild(div);
    });
  } else {
    wrongList.style.display = 'none';
    retryBtn.style.display = 'none';
  }

  showScreen('results');
}

function retryWrong() {
  retryQuestions = [...wrongAnswers];
  currentQ = 0;
  score = 0;
  wrongAnswers = [];
  retryMode = true;
  showScreen('quiz');
  showQuestion();
}

// ===== INIT =====
window.addEventListener('load', () => {
  renderHome();
  // Init canvas when quiz screen shows
  const observer = new MutationObserver(() => {
    if (document.getElementById('quiz').classList.contains('active')) {
      setTimeout(initCanvas, 50);
    }
  });
  observer.observe(document.getElementById('quiz'), { attributes: true, attributeFilter: ['class'] });
});

// Handle Enter key for typing mode
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && mode === 'type' && document.getElementById('quiz').classList.contains('active')) {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn.style.display === 'block') {
      nextQuestion();
    } else {
      submitTyped();
    }
  }
});
</script>
